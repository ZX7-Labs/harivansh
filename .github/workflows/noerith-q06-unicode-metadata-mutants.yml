name: Q06 Unicode metadata ten assertion mutation qualification
on:
  push:
    branches: [build/noerith-q06-unicode-metadata-20261015]
    paths: [.github/workflows/noerith-q06-unicode-metadata-mutants.yml]
permissions:
  contents: read
jobs:
  exact-private-nine-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: b4096e1cdb1e7c70f88fb12c58213e007961fbc9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Run pinned assertion-sensitive private mutants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-phrasebank-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/toolchain-private.log" 2>&1
          cd "$ROOT"
          export RUSTUP_TOOLCHAIN=1.98.1
          python3 tools/verify_q06_task6_phrasebank_mutants.py >"$LOG" 2>&1 || {
            echo Q06_PHRASEBANK_MUTANTS_NOT_QUALIFIED
            exit 1
          }
          grep -Fq 'Q06_PHRASEBANK_MUTANT_QUALIFICATION=PASS count=10' "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 10
          grep '^Q06_PHRASEBANK_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_PHRASEBANK_TEN_ASSERTION_MUTANTS=PASS
