name: Q06 source-owned event speaker evidence actual assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-speaker-evidence-assertion-red-20261016.yml]
permissions:
  contents: read
jobs:
  pinned-private-speaker-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      TARGET_SHA: cb3222ce9ba937ede25266db2e0d695c9f671e92
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact pinned private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require real Rust assertion RED not compile/setup failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-speaker-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-install-private.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test turn_attribution_dev even_validated_subject_and_source_cannot_forge_unreviewed_user_speaker >"$LOG" 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_SPEAKER_ATTESTATION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test even_validated_subject_and_source_cannot_forge_unreviewed_user_speaker ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_SPEAKER_ATTESTATION_RED=OBSERVED
