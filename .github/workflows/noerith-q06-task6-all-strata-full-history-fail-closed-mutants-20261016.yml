name: Q06 all 69 families cannot fake reviewed full history
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task6-all-strata-full-history-fail-closed-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-two-assertion-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 8b44e9f80d51e8c28a49a5101c7e41ee394d5833
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Kill actual falsely complete history source mutants by Rust assertion
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-history-mutations-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task6_dev_full_history_fail_closed_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_HISTORY_MUTANT_QUALIFICATION=FAIL Q06_HISTORY_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_HISTORY_TWO_ASSERTION_MUTANTS=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_HISTORY_MUTANT_QUALIFICATION=PASS count=2' "$LOG"
          test "$(grep -Ec '^Q06_HISTORY_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 2
          grep -E '^Q06_HISTORY_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_HISTORY_TWO_ASSERTION_MUTANTS=PASS
