name: NOERITH Q03 isolated i686 benchmark lint class diagnosis
on:
  push:
    branches: [build/noerith-q03-snapshot-signed-red-20261018]
    paths: [.github/workflows/noerith-q03-i686-rss-clippy-lint-class-20261018.yml]
permissions:
  contents: read
jobs:
  private-nonshipping-lint-class:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_SHA: b9fb8afe3ac9099ab9e51d4807a59c94c35c8949
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source-free privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact read-only private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Classify isolated Clippy lint names only, never private messages
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOG="$RUNNER_TEMP/q03-private-rss-clippy.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component clippy --no-self-update >"$RUNNER_TEMP/private-toolchain.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          set +e
          cargo clippy --manifest-path research/q03-legacy-v1-auth-probe/Cargo.toml --all-targets -- -D warnings >"$LOG" 2>&1
          code=$?
          set -e
          python3 - "$LOG" "$code" <<'PY'
          import re, sys
          from pathlib import Path
          report=Path(sys.argv[1]).read_text(errors='replace')
          lint_names=sorted(set(re.findall(r'clippy::([a-z_]+)',report)))
          rust_error_codes=sorted(set(re.findall(r'error\[(E[0-9]{4})\]',report)))
          print("Q03_RSS_LINT_EXIT="+str(sys.argv[2]))
          print("Q03_RSS_LINT_NAMES="+(','.join(lint_names) if lint_names else "NONE"))
          print("Q03_RSS_RUST_CODES="+(','.join(rust_error_codes) if rust_error_codes else "NONE"))
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          echo Q03_RSS_CLIPPY_DIAGNOSTIC_EXACT_PRIVATE_SHA=PASS
