name: Q06 DEV validated population exact private Rust qualification
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-population-green-20261016.yml]
permissions:
  contents: read
jobs:
  private-exact-population-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      TARGET_SHA: bd5ca01acddcf998aeb624a1c5d54549c95afb8c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public source-free relay
        run: bash tests/test-noerith-relay-contract.sh
      - name: Pinned private read-only ephemeral checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Private Rust1.98.1 focused full strict Clippy and Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-population-private-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_DEV_POPULATION_${name}=PASS"
            else
              echo "Q06_DEV_POPULATION_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check focused cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test population_commitment_dev --test full_case_commitment_dev --test full_case_commitment_exact_adversarial_dev
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DEV_POPULATION_EXACT_ALL_GATES=PASS
