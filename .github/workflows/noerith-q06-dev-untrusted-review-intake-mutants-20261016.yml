name: Q06 untrusted review proposal ten real Rust security assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-untrusted-review-intake-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-ten-review-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 6eb4802cffbdf00fa880c0b506883f5ee752ad55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Exact ten bounded proposal-source Rust assertion kills
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-review-claim-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-private-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_dev_untrusted_review_intake_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_REVIEW_INTAKE_MUTANT_QUALIFICATION=FAIL Q06_REVIEW_INTAKE_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_UNTRUSTED_REVIEW_TEN_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_REVIEW_INTAKE_MUTANT_QUALIFICATION=PASS count=10' "$LOG"
          test "$(grep -Ec '^Q06_REVIEW_INTAKE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 10
          grep -E '^Q06_REVIEW_INTAKE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_UNTRUSTED_REVIEW_TEN_MUTANTS_EXACT=PASS
