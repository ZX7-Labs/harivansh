name: Q06 exact private pending unverified review ticket seven assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-pending-review-ticket-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-pending-ticket-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: a1b1864d62208ea069ec86863abfe02c552a223d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact read-only ephemeral private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Seven private real Rust assertion mutants, zero private source output
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-ticket-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-ticket-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_dev_unverified_ticket_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_TICKET_MUTANTS=FAIL (Q06_TICKET_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)|Q06_TICKET_INCOMPLETE_MUTANT_QUALIFICATION|Q06_TICKET_SOURCE_INTEGRITY_FAILURE)$' "$LOG" || true
            echo Q06_TICKET_ASSERTION_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_TICKET_MUTANTS=PASS count=7' "$LOG"
          test "$(grep -Ec '^Q06_TICKET_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 7
          grep -E '^Q06_TICKET_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_TICKET_ASSERTION_MUTANTS_EXACT=PASS
