name: Q06 development local observer private rustfmt coordinates only
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-partial-claim-fmt-metadata.yml]
permissions:
  contents: read
jobs:
  rustfmt-coordinate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 8109d7f806a3ed9806a28270daae8f6d018a8560
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Only Rustfmt hunk coordinates, never private file contents
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-observe-private-rustfmt.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"${RUNNER_TEMP}/toolchain-private.log" 2>&1
          cd "$ROOT"
          cargo +1.98.1 fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml >"$LOG" 2>&1
          python3 - <<'PY'
          import re, subprocess
          cases = (
              ('SOURCE', 'tools/q06-memory-context-eval/src/durable_custody_dev.rs'),
              ('TEST', 'tools/q06-memory-context-eval/tests/durable_custody_dev.rs'),
              ('ATTACK', 'tools/q06-memory-context-eval/tests/durable_observation_adversarial_dev.rs'),
          )
          for label, path in cases:
              diff = subprocess.check_output(['git', 'diff', '--unified=0', '--', path], text=True)
              hunks = re.findall(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@', diff, re.M)
              if len(hunks) > 40:
                  raise SystemExit('Q06_OBSERVER_FMT_UNEXPECTED_BOUNDS')
              for coordinates in hunks:
                  print('Q06_OBSERVER_FMT_HUNK_' + label + '=' + ':'.join(str(int(n or 1)) for n in coordinates))
              print('Q06_OBSERVER_FMT_COUNT_' + label + '=' + str(len(hunks)))
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q06_OBSERVER_FMT_COORDINATES_ONLY=PASS
