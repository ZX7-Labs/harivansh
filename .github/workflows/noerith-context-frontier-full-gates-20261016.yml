name: NOERITH context selected dependency exact full Rust verification
on:
  push:
    branches: [build/noerith-context-frontier-verify-20261016]
    paths: [.github/workflows/noerith-context-frontier-full-gates-20261016.yml]
permissions:
  contents: read
jobs:
  private-source-exact-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: b57a1bb07cb35af81e7c73141b4962862ff5d19c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only exact private source checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Exact Rust 1.98.1 full workspace qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/context-frontier-private-tests"
          mkdir -p "$LOGDIR"
          chmod 700 "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "CONTEXT_FRONTIER_$label=PASS"
            else
              echo "CONTEXT_FRONTIER_$label=FAIL"
              exit 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          check focused-exact cargo test --locked -p noerith-cognition --test context_compiler selected_exact_source_cannot_escape_frontier_dependency_tracking
          check focused-fact cargo test --locked -p noerith-cognition --test structured_context selected_protected_structured_fact_needs_its_exact_frontier_dependency
          check focused-fidelity cargo test --locked -p noerith-cognition --test fidelity sufficient_report_must_not_mask_selected_source_missing_from_frontier
          check focused-derived cargo test --locked -p noerith-cognition --test context_compiler selected_derived_view_cannot_omit_extra_parent_independent_dependency
          check focused-excluded cargo test --locked -p noerith-cognition --test context_compiler excluded_nonessential_candidate_dependency_does_not_block_safe_selected_source
          check focused-source-version cargo test --locked -p noerith-cognition --test context_compiler selected_exact_source_version_dependency_must_remain_current
          check focused-empty-selected cargo test --locked -p noerith-cognition --test context_compiler selected_exact_source_with_no_declared_freshness_dependency_cannot_be_qualified
          check focused-empty-guard cargo test --locked -p noerith-cognition --test fidelity sufficient_fidelity_report_cannot_certify_selected_source_with_zero_dependencies
          check focused-empty-structured cargo test --locked -p noerith-cognition --test structured_context selected_structured_fact_with_no_freshness_dependencies_is_rejected
          check cognition-full cargo test --locked -p noerith-cognition
          check workspace-full cargo test --locked --workspace
          check strict-clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          check rustfmt cargo fmt --all -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          echo CONTEXT_FRONTIER_EXACT_ALL_GATES=PASS
