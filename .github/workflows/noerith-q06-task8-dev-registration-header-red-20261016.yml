name: Q06 registration header private exact assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-registration-header-red-20261016.yml]
permissions:
  contents: read
jobs:
  source-free-exact-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 3664e16d0e077bd51633ec4eee45fde7ebbcda7c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source-free public relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Verify genuine assertion RED, never compiler failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-registration-header-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/q06-registration-rust-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test registered_case_header_dev changing_each_semantically_registered_identity_or_boundary_must_change_header_digest >"$LOG" 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_REGISTRATION_HEADER_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test changing_each_semantically_registered_identity_or_boundary_must_change_header_digest ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_REGISTRATION_HEADER_ASSERTION_RED=OBSERVED
