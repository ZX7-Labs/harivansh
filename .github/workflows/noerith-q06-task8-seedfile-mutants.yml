name: Q06 Task8 development seed-file seven assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-seedfile-mutants.yml]
permissions:
  contents: read
jobs:
  isolated-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 6faf63465d40839a34a616a6b2b9242459a2079f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Private exact detached source checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Reject compiler failures and require seven named Rust assertion kills
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-isolation-private-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/toolchain.log" 2>&1
          cd "$ROOT"
          python3 tools/verify_q06_task8_dev_seedfile_mutants.py >"$LOG" 2>&1 || {
            grep -E '^Q06_SEEDFILE_MUTANT_QUALIFICATION=FAIL Q06_SEEDFILE_MUTANT_[a-z-]+=(SOURCE_MISMATCH|SURVIVED|COMPILER_ERROR_NOT_ASSERTION|WRONG_ASSERTION)$' "$LOG" || true
            echo Q06_SEEDFILE_MUTANT_GATE=FAIL
            exit 1
          }
          grep -Fxq 'Q06_SEEDFILE_MUTANT_QUALIFICATION=PASS count=7' "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 7
          grep '^Q06_SEEDFILE_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_SEEDFILE_SEVEN_ASSERTION_MUTANTS=PASS
