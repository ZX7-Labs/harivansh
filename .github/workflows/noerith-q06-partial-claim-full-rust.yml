name: Q06 local-claim observer exact private Rust qualification
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-partial-claim-full-rust.yml]
permissions:
  contents: read
jobs:
  exact-private-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: bfeb7d51ab3ba2cbad66c752df4c477d1a19a135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free public boundary
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral read-only private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Exact private Rust focused, full crate, Clippy and fmt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-observe-green-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_OBSERVER_${name}=PASS"
            else
              echo "Q06_OBSERVER_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check focused cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test durable_custody_dev local_observation_must
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          git diff --exit-code --quiet
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q06_OBSERVER_EXACT_ALL_GATES=PASS
