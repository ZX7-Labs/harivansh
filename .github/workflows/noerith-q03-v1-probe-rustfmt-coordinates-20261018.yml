name: NOERITH Q03 private research rustfmt coordinates
on:
  push:
    branches: [build/noerith-q03-snapshot-signed-red-20261018]
    paths: [.github/workflows/noerith-q03-v1-probe-rustfmt-coordinates-20261018.yml]
permissions:
  contents: read
jobs:
  coordinates-sourcefree:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 58e62e7e4434ba863d36f3e5d4a485534a84efe0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Print line coordinates only for exact private rustfmt hunk changes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/toolchain.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cargo fmt --manifest-path research/q03-legacy-v1-auth-probe/Cargo.toml >"$RUNNER_TEMP/private-fmt.log" 2>&1
          git diff --unified=0 -- research/q03-legacy-v1-auth-probe/src/lib.rs >"$RUNNER_TEMP/private-probe.patch"
          python3 - "$RUNNER_TEMP/private-probe.patch" <<'PY'
          import sys,re
          from pathlib import Path
          data=Path(sys.argv[1]).read_text()
          hunks=re.findall(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@",data,re.M)
          print("Q03_PROBE_RUSTFMT_HUNK_COUNT="+str(len(hunks)))
          print("Q03_PROBE_RUSTFMT_HUNK_COORDS="+",".join(f"{a}:{b or '1'}" for a,b,_,_ in hunks))
          print("Q03_PROBE_RUSTFMT_PATCH_BYTES="+str(len(data.encode())))
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q03_PROBE_FORMAT_COORDINATES_ONLY=PASS
