name: Q06 DEV population nine exact private Rust assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-population-nine-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-nine-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 7c7e4fe5929ed4039e90568f0a8483fb5d80fd9c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Private source exact ephemeral read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Nine real named Rust assertion kills, no source or failure log disclosure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-population-nine-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-private-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task8_dev_population_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_POP_MUTANT_QUALIFICATION=FAIL Q06_POP_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_POP_NINE_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_POP_MUTANT_QUALIFICATION=PASS count=9' "$LOG"
          test "$(grep -Ec '^Q06_POP_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 9
          grep -E '^Q06_POP_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_POP_NINE_MUTANTS_EXACT=PASS
