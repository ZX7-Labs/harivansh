name: Q06 source-backed Hindi fragment plus independent speaker gate full Rust
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-candidate-turn-speaker-green-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-turn-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 85baf3cfe9212a63391dd1f517d9c384e72a89bf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral pinned private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Source-review plus speaker evidence, full crate and strict Rust
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-private-turn-source"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_TURN_${name}=PASS"
            else
              echo "Q06_TURN_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check source-fragment cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test candidate_turn_gate_dev
          check speaker-attribution cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test turn_attribution_dev
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_TURN_EXACT_ALL_GATES=PASS
