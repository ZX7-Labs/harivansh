name: Q06 exact case buffered-to-streaming SHA256 Rust equality/full gates
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-full-case-streaming-green-20261016.yml]
permissions:
  contents: read
jobs:
  private-exact-streaming-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 56e7d6e8dd2e399d19ac8e07edd87eb09f3a98dc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact source checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Canonical streamed digest, exact full crate, strict Clippy, Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-streaming-private-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_STREAM_${name}=PASS"
            else
              echo "Q06_STREAM_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check chunk-oracle cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --lib exact_chunked_dev_transcript_streaming_digest_matches_independent_buffered_oracle
          check dev-case cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test full_case_commitment_dev --test full_case_commitment_exact_adversarial_dev --test dev_case_crossprocess_commitment
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_STREAM_EXACT_ALL_GATES=PASS
