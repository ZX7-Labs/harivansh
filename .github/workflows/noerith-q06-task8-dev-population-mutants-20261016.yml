name: Q06 DEV population eight exact private real Rust assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-population-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-population-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 105195106588236dcf0e69e12797a3cb3538a3f5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source-free public relay
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral pinned private source read-only
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Actual eight named Rust source mutations
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-q06-population-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-toolchain.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task8_dev_population_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_POP_MUTANT_QUALIFICATION=FAIL Q06_POP_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_POP_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_POP_MUTANT_QUALIFICATION=PASS count=8' "$LOG"
          test "$(grep -Ec '^Q06_POP_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 8
          grep -E '^Q06_POP_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_POP_MUTANTS_EXACT=PASS
