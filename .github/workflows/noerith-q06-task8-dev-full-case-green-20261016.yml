name: Q06 complete registered case typed DEV private Rust qualification
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-full-case-green-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      TARGET_SHA: 5d24cb386767fda4dd115cf69681197e15726356
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check public bootstrap privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral read-only exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Real focused full strict Clippy and fmt exact Rust gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-full-case-private-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_FULL_CASE_${name}=PASS"
            else
              echo "Q06_FULL_CASE_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check focused cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test full_case_commitment_dev --test full_case_commitment_exact_adversarial_dev
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_FULL_CASE_EXACT_ALL_GATES=PASS
