name: Q06 cached immutable family registry exact two Rust assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-family-registry-cache-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  pinned-private-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: cda6aebc1f30786b1731d9ae7748e96246d78cf0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral pinned private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Two named real source mutation assertion kills
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-family-cache-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-toolchain.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task8_dev_registry_cache_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_REG_CACHE_MUTANT_QUALIFICATION=FAIL Q06_REG_CACHE_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_REG_CACHE_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_REG_CACHE_MUTANT_QUALIFICATION=PASS count=2' "$LOG"
          test "$(grep -Ec '^Q06_REG_CACHE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 2
          grep -E '^Q06_REG_CACHE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_REG_CACHE_MUTANTS_EXACT=PASS
