name: Q06 actual reviewed event text four assertion mutants
on:
  push:
    branches: [build/noerith-q06-rendered-event-witness-20261015]
    paths: [.github/workflows/noerith-q06-rendered-event-mutants.yml]
permissions:
  contents: read
jobs:
  assertion-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 9bb40aeb4c90f6bc02c5a3560ff4d4d6d27c375d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free public contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact ephemeral private read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require assertion failures instead of setup or compile errors
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-event-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/toolchain-private.log" 2>&1
          cd "$ROOT"
          python3 tools/verify_q06_task6_rendered_event_mutants.py >"$LOG" 2>&1 || {
            echo Q06_EVENT_MUTANTS=FAIL
            exit 1
          }
          grep -Fxq 'Q06_RENDERED_EVENT_MUTANT_QUALIFICATION=PASS count=4' "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 4
          grep '^Q06_RENDERED_EVENT_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_RENDERED_EVENT_FOUR_ASSERTION_MUTANTS=PASS
