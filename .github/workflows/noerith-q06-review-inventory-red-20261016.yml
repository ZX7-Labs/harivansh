name: Q06 typed source reviewed 22 event and 11 probe kinds assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-review-inventory-red-20261016.yml]
permissions:
  contents: read
jobs:
  exact-pinned-private-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_SHA: 9e0dbbd18d17b9ccca9c8587c22998eaf459aaf7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact read-only ephemeral private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: One named compiled failing assertion only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-review-inventory-private-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test reviewed_surface_inventory_dev exactly_two_reviewed_event_fragments_and_twenty_unreviewed_kinds >"$LOG" 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_REVIEW_INVENTORY_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test exactly_two_reviewed_event_fragments_and_twenty_unreviewed_kinds ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q06_REVIEW_INVENTORY_ASSERTION_RED=OBSERVED
