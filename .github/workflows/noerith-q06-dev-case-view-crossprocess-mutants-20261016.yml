name: Q06 exact private fresh-process five DEV three-domain assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-case-view-crossprocess-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-five-process-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: cea1b5f45efb52adc599e93b59840470846244ed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Five genuine independent-process Rust assertion mutation kills
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-xprocess-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-private-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_dev_crossprocess_commitment_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_XPROCESS_MUTANT_QUALIFICATION=FAIL Q06_XPROCESS_MUTANT_[a-z0-9-]+=(SURVIVED|COMPILER_FAILURE_NOT_KILL|WRONG_ASSERTION|SOURCE_MISMATCH)$' "$LOG" || true
            echo Q06_XPROCESS_FIVE_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_XPROCESS_MUTANT_QUALIFICATION=PASS count=5' "$LOG"
          test "$(grep -Ec '^Q06_XPROCESS_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 5
          grep -E '^Q06_XPROCESS_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_XPROCESS_FIVE_MUTANTS_EXACT=PASS
