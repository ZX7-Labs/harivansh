name: Q06 seed-file ancestor-symlink assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-ancestor-symlink-red.yml]
permissions:
  contents: read
jobs:
  exact-private-synthetic-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: db0f149952fa2013a9f11c7b928b8b9bbeda377d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require real Rust regression assertion RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-ancestor-symlink-regression.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-private-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test secret_seed_file_dev symlinked_ancestor_of_seed_file_must_be_rejected >"$LOG" 2>&1
          RESULT=$?
          set -e
          test "$RESULT" -ne 0
          if grep -Eq 'error\[E[0-9]+\]|error: could not compile|error: failed to' "$LOG"; then
            echo Q06_SEED_PARENT_SYMLINK_RED=BLOCKED_COMPILE
            exit 1
          fi
          grep -Fq 'test symlinked_ancestor_of_seed_file_must_be_rejected ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_SEED_PARENT_SYMLINK_ASSERTION_RED=OBSERVED
