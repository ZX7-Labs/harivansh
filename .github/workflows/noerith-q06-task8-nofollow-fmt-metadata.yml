name: Q06 seedfile nofollow source-free formatter metadata only
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-nofollow-fmt-metadata.yml]
permissions:
  contents: read
jobs:
  format-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: a0bb56ce6acbaab9008e7a1af1d248c213044f8d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Emit only bounded formatting metadata, no private source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          FILE=tools/q06-memory-context-eval/src/secret_seed_file.rs
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"${RUNNER_TEMP}/q06-rustfmt-install-private.log" 2>&1
          before="$(sha256sum "$FILE" | cut -d ' ' -f1)"
          cargo +1.98.1 fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml >"${RUNNER_TEMP}/q06-rustfmt-private.log" 2>&1
          after="$(sha256sum "$FILE" | cut -d ' ' -f1)"
          git diff --unified=0 -- "$FILE" >"${RUNNER_TEMP}/q06-rustfmt-private.diff"
          python3 - "${RUNNER_TEMP}/q06-rustfmt-private.diff" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding='utf-8').read().splitlines()
          for line in lines:
              if line.startswith('@@'):
                  matched = re.match(r'^@@ -([0-9]+)(?:,([0-9]+))? \+([0-9]+)(?:,([0-9]+))? @@', line)
                  if matched is None:
                      raise SystemExit("Q06_FMT_METADATA_PARSE_ERROR")
                  print("Q06_FMT_HUNK=" + ":".join(str(int(x or 1)) for x in matched.groups()))
          print("Q06_FMT_DELETED_LINES=" + str(sum(l.startswith('-') and not l.startswith('---') for l in lines)))
          print("Q06_FMT_ADDED_LINES=" + str(sum(l.startswith('+') and not l.startswith('+++') for l in lines)))
          PY
          echo "Q06_FMT_BEFORE_SHA256=$before"
          echo "Q06_FMT_EXPECTED_SHA256=$after"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q06_FMT_SOURCE_FREE_PROBE=PASS
