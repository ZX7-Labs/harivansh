name: Q06 seedfile nofollow source-free formatter metadata only
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-nofollow-fmt-metadata.yml]
permissions:
  contents: read
jobs:
  format-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 3838378d566d3fe3f404dac878b36fd168aebd18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Emit only bounded formatting metadata, no private source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"${RUNNER_TEMP}/q06-rustfmt-install-private.log" 2>&1
          cargo +1.98.1 fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml >"${RUNNER_TEMP}/q06-rustfmt-private.log" 2>&1
          git diff --unified=0 -- tools/q06-memory-context-eval >"${RUNNER_TEMP}/q06-rustfmt-private.diff"
          python3 - "${RUNNER_TEMP}/q06-rustfmt-private.diff" <<'PY'
          import re, sys
          allowed = {
              "tools/q06-memory-context-eval/src/secret_seed_file.rs": "SRC",
              "tools/q06-memory-context-eval/tests/secret_seed_file_dev.rs": "TEST",
              "tools/q06-memory-context-eval/src/secret_seed_root_directory.rs": "DIRFD_SRC",
              "tools/q06-memory-context-eval/tests/seed_root_dir_dev.rs": "DIRFD_TEST",
              "tools/q06-memory-context-eval/src/durable_custody_dev.rs": "CUSTODY_SRC",
              "tools/q06-memory-context-eval/tests/durable_custody_dev.rs": "CUSTODY_TEST",
          }
          label = None
          count = 0
          for line in open(sys.argv[1], encoding="utf-8"):
              if line.startswith("diff --git "):
                  match = re.match(r"diff --git a/(.+) b/(.+)$", line.strip())
                  if match is None or match.group(1) != match.group(2) or match.group(1) not in allowed:
                      raise SystemExit("Q06_FMT_UNEXPECTED_PRIVATE_CHANGE")
                  label = allowed[match.group(1)]
              elif line.startswith("@@"):
                  match = re.match(r"^@@ -([0-9]+)(?:,([0-9]+))? \+([0-9]+)(?:,([0-9]+))? @@", line)
                  if match is None or label is None:
                      raise SystemExit("Q06_FMT_HUNK_PARSE_ERROR")
                  print("Q06_FMT_HUNK=" + label + ":" + ":".join(str(int(x or 1)) for x in match.groups()))
                  count += 1
          print("Q06_FMT_TOTAL_HUNKS=" + str(count))
          PY
          # Transport only whitespace gaps and hashes. No private code bytes.
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          paths = [
              "tools/q06-memory-context-eval/src/secret_seed_root_directory.rs",
              "tools/q06-memory-context-eval/tests/seed_root_dir_dev.rs",
              "tools/q06-memory-context-eval/src/durable_custody_dev.rs",
              "tools/q06-memory-context-eval/tests/durable_custody_dev.rs",
          ]
          def split_whitespace(data):
              letters, gaps, current = bytearray(), [], bytearray()
              for byte in data:
                  if byte in b" \t\r\n\v\f":
                      current.append(byte)
                  else:
                      gaps.append(bytes(current))
                      current.clear()
                      letters.append(byte)
              gaps.append(bytes(current))
              return bytes(letters), gaps

          for path in paths:
              before = subprocess.check_output(["git", "show", "HEAD:" + path])
              after = Path(path).read_bytes()
              chars_before, gaps_before = split_whitespace(before)
              chars_after, gaps_after = split_whitespace(after)
              if chars_before != chars_after:
                  raise SystemExit("Q06_FMT_WHITESPACE_ONLY=FAIL_NON_WHITESPACE_DRIFT")
              edits = [
                  [idx, base64.b64encode(updated).decode("ascii")]
                  for idx, (original, updated) in enumerate(zip(gaps_before, gaps_after))
                  if original != updated
              ]
              if len(edits) > 120 or sum(len(value) for _, value in edits) > 8192:
                  raise SystemExit("Q06_FMT_WHITESPACE_ONLY=FAIL_BOUNDS")
              label = {paths[0]: "DIRFD_SRC", paths[1]: "DIRFD_TEST", paths[2]: "CUSTODY_SRC", paths[3]: "CUSTODY_TEST"}[path]
              packet = {
                  "label": label,
                  "before_sha256": hashlib.sha256(before).hexdigest(),
                  "after_sha256": hashlib.sha256(after).hexdigest(),
                  "chars_sha256": hashlib.sha256(chars_before).hexdigest(),
                  "edits": edits,
              }
              print("Q06_FMT_WHITESPACE_RECIPE=" + json.dumps(packet, separators=(",", ":")))
          print("Q06_FMT_WHITESPACE_ONLY=PASS")
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo Q06_FMT_SOURCE_FREE_PROBE=PASS
