name: Q06 Task8 durable adversarial exact full Rust gates
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-durable-adversarial-full-rust.yml]
permissions:
  contents: read
jobs:
  exact-private-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 60ff5561678b1ef5a956b61e4a8f41ed0a5db223
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free public boundary
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral read-only private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Source pinned focused and complete Rust gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-phrasebank-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_PHRASEBANK_${name}=PASS"
            else
              echo "Q06_PHRASEBANK_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check focused cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test durable_custody_dev --test durable_custody_adversarial_dev
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_PHRASEBANK_EXACT_ALL_GATES=PASS
