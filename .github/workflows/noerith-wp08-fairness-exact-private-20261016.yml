name: WP08 exact private synthetic fairness assertion verification
on:
  push:
    branches: [build/noerith-wp08-private-verify-20261016]
    paths: [.github/workflows/noerith-wp08-fairness-exact-private-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-wp08-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: e9d265dc97330c4537b8a7a5ea9f3271d5ea71f3
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact SHA private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Exact-head synthetic algorithm gates (never authority)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/wp08-private-output"
          mkdir -p "$LOGDIR"
          chmod 700 "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT/experiments/wp08-fairness"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "WP08_SYNTHETIC_$name=PASS"
            else
              echo "WP08_SYNTHETIC_$name=FAIL"
              exit 1
            fi
          }
          check interpreter python3 --version
          check compile python3 -c "import ast,pathlib;[ast.parse(pathlib.Path(p).read_text()) for p in ['fairness_reference.py','test_fairness_reference.py','verify_mutations.py']]"
          check assertions python3 -m unittest -q test_fairness_reference.py
          if python3 verify_mutations.py >"$LOGDIR/mutants.log" 2>&1; then
            test "$(grep -Ec '^WP08_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOGDIR/mutants.log")" -eq 12
            grep -Fxq 'WP08_SYNTHETIC_NAMED_ASSERTION_MUTANTS=PASS count=12' "$LOGDIR/mutants.log"
            echo WP08_SYNTHETIC_mutants=PASS
          else
            python3 -c 'import pathlib,re,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace"); m=re.findall(r"(MUTATION_NOT_SINGLE_EXACT_MATCH|NOT_KILLED_BY_EXPECTED_ASSERTION):([a-z0-9-]+)",s); v=(m[-1][0]+":"+m[-1][1]) if m else ("PRISTINE_SOURCE_MUTATED:UNKNOWN" if "PRISTINE_SOURCE_MUTATED" in s else "UNCLASSIFIED_FAILURE:UNKNOWN"); print("WP08_SAFE_MUTATION_DIAG="+v)' "$LOGDIR/mutants.log"
            echo WP08_SYNTHETIC_mutants=FAIL
            exit 1
          fi
          check import-boundary python3 -c "import ast,pathlib; t=ast.parse(pathlib.Path('fairness_reference.py').read_text()); banned={'subprocess','requests','socket','ctypes','pickle','os','sys','importlib'}; roots={item.name.split('.')[0] for n in ast.walk(t) for item in (n.names if isinstance(n,ast.Import) else [n] if isinstance(n,ast.ImportFrom) else []) if getattr(item,'name',None)}; assert not roots&banned"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          git -C "$ROOT" diff --quiet --exit-code
          echo WP08_PRIVATE_SYNTHETIC_EXACT_SOURCE_GATES=PASS
