name: Q06 source-reviewed private history gap full Rust qualification
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-history-private-gap-green-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-source-history-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 39103d5ebe6a5371d160568dffbcfe5339d8b137
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Pinned exact ephemeral private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Real 69-family exact gap source, full Rust Clippy fmt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-history-gap-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_HISTORY_GAPS_${name}=PASS"
            else
              echo "Q06_HISTORY_GAPS_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check reviewed-accounting cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test history_readiness_dev
          check all-source cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_HISTORY_GAPS_EXACT_ALL_GATES=PASS
