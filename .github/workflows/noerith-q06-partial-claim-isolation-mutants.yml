name: Q06 partial-claim six isolation source mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-partial-claim-isolation-mutants.yml]
permissions:
  contents: read
jobs:
  exact-private-isolation-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 12bd6565f95e5e18be85bc156fbe5444fefd737c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reviewed source-free relay boundary
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact ephemeral read-only private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Run exact isolated source-owned assertion mutants
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-integrated-isolation-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/q06-isolation-toolchain-private.log" 2>&1
          cd "$ROOT"
          if ! python3 -B tools/verify_q06_task8_dev_isolation_mutants.py >"$LOG" 2>&1; then
            echo Q06_INTEGRATED_ISOLATION_MUTANTS=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_ISOLATION_MUTANT_QUALIFICATION=PASS count=6' "$LOG"
          test "$(grep -Ec '^Q06_ISOLATION_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 6
          grep -E '^Q06_ISOLATION_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_INTEGRATED_ISOLATION_MUTANTS=PASS
