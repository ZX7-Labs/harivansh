name: Q06 exact private source-owned case/view fresh-process genuine assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-case-view-crossprocess-red-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-crossprocess-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 91a08f0f644e15fc2906adbbdd1928d298c3577f
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free public control contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private ephemeral read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Prove genuine fresh OS-process assertion RED and exclude compiler failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-crossprocess-private-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/q06-rust-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test dev_case_crossprocess_commitment fresh_os_process_must_recompute_exact_dev_case_population_and_view >"$LOG" 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_DEV_XPROCESS_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test fresh_os_process_must_recompute_exact_dev_case_population_and_view ... FAILED' "$LOG"
          grep -Fq 'Q06_FRESH_PROCESS_MUST_RECOMPUTE_IDENTICAL_TRIPLE_FROM_SOURCE' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DEV_XPROCESS_RED=OBSERVED
