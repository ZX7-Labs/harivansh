name: NOERITH private rustfmt shape-only fault analysis
on:
  push:
    branches: [build/noerith-kernel-callback-verify-20261016]
    paths: [.github/workflows/noerith-kernel-callback-rustfmt-shape-20261016.yml]
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 5f2005e0e811c731ed8bf547b355c36b612cc548
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact ephemeral private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Rustfmt old and new shapes only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/rust.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cp crates/noerith-kernel/src/lib.rs "$RUNNER_TEMP/original.txt"
          cargo fmt --all >"$RUNNER_TEMP/fmt.log" 2>&1
          python3 - "$RUNNER_TEMP/original.txt" crates/noerith-kernel/src/lib.rs <<'PY'
          import sys,pathlib,difflib
          old=pathlib.Path(sys.argv[1]).read_text().splitlines()
          new=pathlib.Path(sys.argv[2]).read_text().splitlines()
          opcodes=difflib.SequenceMatcher(a=old,b=new,autojunk=False).get_opcodes()
          for tag,i,j,k,m in opcodes:
              if tag=='equal':continue
              before=old[i:j];after=new[k:m]
              print(f'FORMAT_SHAPE={tag} oldline={i+1} newlines={k+1} oldcount={len(before)} newcount={len(after)}')
              print('FORMAT_BEFORE_LENGTHS='+','.join(str(len(q)) for q in before))
              print('FORMAT_AFTER_LENGTHS='+','.join(str(len(q)) for q in after))
              print('FORMAT_BEFORE_END_COMMAS='+''.join('Y' if s.strip().endswith(',') else 'N' for s in before))
              print('FORMAT_AFTER_END_COMMAS='+''.join('Y' if s.strip().endswith(',') else 'N' for s in after))
              print('FORMAT_BEFORE_END_PARENS='+''.join('Y' if s.strip().endswith(');') else 'N' for s in before))
              print('FORMAT_AFTER_END_PARENS='+''.join('Y' if s.strip().endswith(');') else 'N' for s in after))
          PY
          echo KERNEL_RUSTFMT_SHAPE_OBSERVED
