name: NOERITH Q03 independent pending authority test-first RED
on:
  push:
    branches: [build/noerith-q03-snapshot-signed-red-20261018]
    paths: [.github/workflows/noerith-q03-pending-authority-testfirst-red-20261018.yml]
permissions:
  contents: read
jobs:
  exact-private-pending-authority-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: 7f88fbe573df25e930b422c78ac8e3cc0fafa7b6
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source-free relay policy
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private detached checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Assert real Rust failing boundary and no private output
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOG="$RUNNER_TEMP/q03-pending-authority-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          if ! rustup toolchain install 1.98.1 --profile minimal --no-self-update >"$RUNNER_TEMP/q03-private-toolchain.log" 2>&1; then
            echo Q03_PENDING_AUTHORITY_RED=TOOLCHAIN_UNAVAILABLE
            exit 1
          fi
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          set +e
          cargo test --locked -p noerith-storage --test q03_pending_authority_red >"$LOG" 2>&1
          status=$?
          set -e
          python3 - "$LOG" "$status" <<'PY'
          import re,sys
          from pathlib import Path
          d=Path(sys.argv[1]).read_text(errors="replace")
          expected="pending_q03_publication_must_not_reactivate_an_outdated_source_authority"
          failed=re.findall(r"^test ([A-Za-z0-9_]+) \.\.\. FAILED$",d,re.M)
          compiled=not re.search(r"^error\[E[0-9]+\]:|^error: could not compile",d,re.M)
          qualified=(sys.argv[2]=="101" and failed==[expected] and "Q03_STALE_PENDING_ISSUER_MUST_NOT_BE_ACTIVATED" in d and "test result: FAILED. 0 passed; 1 failed;" in d and compiled)
          if not qualified:
            print("Q03_PENDING_AUTHORITY_RED=UNQUALIFIED")
            print("Q03_PENDING_AUTHORITY_FAILED_COUNT="+str(len(failed)))
            print("Q03_PENDING_AUTHORITY_COMPILED="+str(compiled))
            print("Q03_PENDING_AUTHORITY_ASSERTION="+str("Q03_STALE_PENDING_ISSUER_MUST_NOT_BE_ACTIVATED" in d))
            sys.exit(1)
          print("Q03_PENDING_AUTHORITY_ASSERTION_RED=OBSERVED")
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          echo Q03_PENDING_AUTHORITY_EXACT_PRIVATE_SOURCE=PASS
