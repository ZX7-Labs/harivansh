name: Q06 exact private fresh-process three-domain Rust qualification
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-dev-case-view-crossprocess-green-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-fresh-process-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      TARGET_SHA: 6f09e97cd9a08a798513bd2b205717bfe4426079
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Fresh OS process, full crate, strict Clippy and Rustfmt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/q06-xprocess-private"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          check() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/$name.log" 2>&1; then
              echo "Q06_XPROCESS_${name}=PASS"
            else
              echo "Q06_XPROCESS_${name}=FAIL"
              return 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          check child-process cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test dev_case_crossprocess_commitment fresh_os_process_must_recompute_exact_dev_case_population_and_view
          check focused cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test dev_case_crossprocess_commitment
          check full-crate cargo test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked
          check strict-clippy cargo clippy --manifest-path tools/q06-memory-context-eval/Cargo.toml --all-targets --locked -- -D warnings
          check fmt cargo fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_XPROCESS_EXACT_ALL_GATES=PASS
