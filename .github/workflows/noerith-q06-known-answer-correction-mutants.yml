name: Q06 correction independent known-answer three assertion mutants
on:
  push:
    branches: [build/noerith-q06-known-answer-correction-20261015]
    paths: [.github/workflows/noerith-q06-known-answer-correction-mutants.yml]
permissions:
  contents: read
jobs:
  correction-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: b78f1f77c125342d35abfd35c1e8a1b544f3fcf0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact detached private SHA
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Independent truth-table assertion mutation qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/correction-private-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rustup-private.log" 2>&1
          cd "$ROOT"
          python3 tools/verify_q06_task5_known_answer_correction_mutants.py >"$LOG" 2>&1 || {
            echo Q06_CORRECTION_MUTANT_QUALIFICATION=FAIL
            exit 1
          }
          grep -Fxq 'Q06_CORRECTION_MUTANT_QUALIFICATION=PASS count=3' "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 3
          grep '^Q06_CORRECTION_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_CORRECTION_THREE_ASSERTION_MUTANTS=PASS
