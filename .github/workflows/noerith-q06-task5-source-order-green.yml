name: NOERITH Q06 source-order candidate pinned verification

on:
  push:
    branches:
      - build/noerith-q06-source-order-red-20261015
    paths:
      - .github/workflows/noerith-q06-task5-source-order-green.yml

permissions:
  contents: read

jobs:
  pinned-private-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 9d7051eb3b2b72f6781f0a10d1ac9e9f97696200
    steps:
      - name: Checkout public source-free relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce source-free privacy contract
        shell: bash
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact read-only private checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Execute fmt focused full-crate and strict lint
        shell: bash
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOGDIR="${RUNNER_TEMP}/source-order-private-logs"
          mkdir -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          MANIFEST=tools/q06-memory-context-eval/Cargo.toml
          gate() {
            local name="$1"
            shift
            if "$@" >"$LOGDIR/${name}.log" 2>&1; then
              echo "Q06_SOURCE_ORDER_GATE_${name}=PASS"
            else
              echo "Q06_SOURCE_ORDER_GATE_${name}=FAIL"
              return 1
            fi
          }
          gate toolchain rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          if rustfmt --edition 2024 --check tools/q06-memory-context-eval/src/validator.rs >"$LOGDIR/fmt-core.log" 2>&1; then
            echo Q06_SOURCE_ORDER_FMT_CORE=PASS
          else
            echo Q06_SOURCE_ORDER_FMT_CORE=FAIL
          fi
          if rustfmt --edition 2024 --check tools/q06-memory-context-eval/tests/validator_source_order.rs >"$LOGDIR/fmt-test.log" 2>&1; then
            echo Q06_SOURCE_ORDER_FMT_TEST=PASS
          else
            echo Q06_SOURCE_ORDER_FMT_TEST=FAIL
          fi
          gate fmt cargo fmt --manifest-path "$MANIFEST" -- --check
          gate focused cargo test --manifest-path "$MANIFEST" --locked --test validator_source_order --test validator --test validator_severity_identity
          gate full-crate cargo test --manifest-path "$MANIFEST" --locked
          gate clippy cargo clippy --manifest-path "$MANIFEST" --all-targets --locked -- -D warnings
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_SOURCE_ORDER_PINNED_GATES=PASS
      - name: Encrypt private diagnostics only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DIAG="${RUNNER_TEMP}/source-order-private-logs"
          mkdir -p "$DIAG"
          tar -C "$DIAG" -cf "${RUNNER_TEMP}/q06-source-order.tar" .
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "${RUNNER_TEMP}/q06-source-order.tar" \
            -out "${RUNNER_TEMP}/q06-source-order.cms" \
            certs/q06-task5-ephemeral-format-transfer.pem
          rm -rf "$DIAG" "${RUNNER_TEMP}/q06-source-order.tar"
      - name: Upload encrypted evidence only (one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q06-source-order-ciphertext
          path: ${{ runner.temp }}/q06-source-order.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Enforce exact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.gate.outcome }}" = success
          echo Q06_SOURCE_ORDER_EXACT_GREEN=PASS
