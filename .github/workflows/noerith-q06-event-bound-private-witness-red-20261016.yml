name: Q06 exact event case-position private unattested witness challenge RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-event-bound-private-witness-red-20261016.yml]
permissions:
  contents: read
jobs:
  independent-real-rust-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ddf34ca7eac42ce179be175e1e57a0b038ea7f42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private source read-only
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require actual Rust assertion RED not compile or setup failure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-turn-challenge-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-private-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test turn_witness_challenge_dev unattested_turn_digest_must_bind_exact_event_position_and_registration >"$LOG" 2>&1
          RESULT=$?
          set -e
          test "$RESULT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_TURN_CHALLENGE_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test unattested_turn_digest_must_bind_exact_event_position_and_registration ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_TURN_CHALLENGE_ASSERTION_RED=OBSERVED
