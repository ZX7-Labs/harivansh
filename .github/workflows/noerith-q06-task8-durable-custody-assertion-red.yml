name: Q06 Task8 synthetic durable custody real assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-durable-custody-assertion-red.yml]
permissions:
  contents: read
jobs:
  exact-private-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 035d5dc8d536c88dd5a21d2a93b07eec9ad8fb1e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Assert test-first genuine Rust failing assertion
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-durable-custody-red-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test durable_custody_dev first_semantic_binding_must_be_durable_and_accept_one_claim >"$LOG" 2>&1
          EXIT=$?
          set -e
          test "$EXIT" -ne 0
          if grep -Eq '^error\[E[0-9]+\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_DURABLE_FIRST_CLAIM_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test first_semantic_binding_must_be_durable_and_accept_one_claim ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DURABLE_FIRST_CLAIM_ASSERTION_RED=OBSERVED
