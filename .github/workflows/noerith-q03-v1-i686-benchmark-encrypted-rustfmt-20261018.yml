name: NOERITH Q03 i686 RSS experiment exact Rustfmt ciphertext
on:
  push:
    branches: [build/noerith-q03-snapshot-signed-red-20261018]
    paths: [.github/workflows/noerith-q03-v1-i686-benchmark-encrypted-rustfmt-20261018.yml]
permissions:
  contents: read
jobs:
  format-private-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 99c34c3e53c7369e42eaac52a3ab30d5d9da3040
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public no-source privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Pinned research-only Rustfmt, CMS encrypt any private diff
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/noerith-private-source"
          PATCH="$RUNNER_TEMP/q03-private-rss-format.patch"
          SEALED="$RUNNER_TEMP/q03-private-rss-format.cms"
          CERT="$GITHUB_WORKSPACE/certs/q03-local-only-encrypted-diagnostics-20261018.pem"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          openssl x509 -in "$CERT" -noout >"$RUNNER_TEMP/check-cert.log" 2>&1
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/toolchain-private.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          M="research/q03-legacy-v1-auth-probe/Cargo.toml"
          cargo fmt --manifest-path "$M" >"$RUNNER_TEMP/private-fmt.log" 2>&1
          cargo fmt --manifest-path "$M" -- --check >"$RUNNER_TEMP/private-format-check.log" 2>&1
          git diff --binary -- research/q03-legacy-v1-auth-probe/src/bin/q03_v1_runtime_memory.rs >"$PATCH"
          changed_count="$(git diff --name-only | wc -l)"
          echo "Q03_I686_FORMAT_CHANGED_COUNT=$changed_count"
          if [ "$changed_count" -ne 1 ]; then
            echo Q03_I686_FORMAT_DIFF_SCOPE=UNQUALIFIED
            exit 1
          fi
          test -s "$PATCH"
          echo "Q03_I686_FORMAT_PATCH_SHA256=$(sha256sum "$PATCH" | cut -d' ' -f1)"
          echo "Q03_I686_FORMAT_PATCH_BYTES=$(wc -c <"$PATCH")"
          openssl cms -encrypt -binary -aes256 -outform DER -in "$PATCH" -out "$SEALED" "$CERT" >"$RUNNER_TEMP/private-cms.log" 2>&1
          test -s "$SEALED"
          rm -f "$PATCH" "$RUNNER_TEMP/private-fmt.log" "$RUNNER_TEMP/private-format-check.log"
          echo Q03_I686_FORMAT_CIPHERTEXT_ONLY=PASS
      - name: Store encrypted diff only for one day
        uses: actions/upload-artifact@v4
        with:
          name: q03-i686-rss-research-fmt-cms-only
          path: ${{ runner.temp }}/q03-private-rss-format.cms
          retention-days: 1
          if-no-files-found: error
