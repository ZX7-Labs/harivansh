name: NOERITH Q04 strict source-qualified mutation and full Rust
on:
  push:
    branches: [build/noerith-q04-strict-applicability-verify-20261017]
    paths: [.github/workflows/noerith-q04-strict-applicability-mutations-exact-20261017.yml]
permissions:
  contents: read
jobs:
  q04-mutation-source-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: cb3c798017b92631ce60aecc6e88bb57449b8604
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact ephemeral read-only private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Same-source genuine assertion mutation qualification and full workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/q04-mutation-private"
          mkdir -m 700 -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "Q04_MUTATION_$label=PASS"
            else
              echo "Q04_MUTATION_$label=FAIL"
              exit 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          check grammar python3 -m unittest -q discover -s tools -p test_verify_q04_strict_applicability_mutations.py
          if python3 tools/verify_q04_strict_applicability_mutations.py >"$LOGDIR/mutations.log" 2>&1; then
            test "$(grep -Ec '^Q04_STRICT_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOGDIR/mutations.log")" -eq 8
            grep -Fxq 'Q04_STRICT_ASSERTION_MUTANTS=PASS count=8' "$LOGDIR/mutations.log"
            echo Q04_MUTATION_eight-named=PASS
          else
            echo Q04_MUTATION_eight-named=FAIL
            exit 1
          fi
          check policy cargo test --locked -p noerith-policy
          check workspace cargo test --locked --workspace
          check clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          check rustfmt cargo fmt --all -- --check
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          echo Q04_MUTATION_EXACT_ALL_GATES=PASS
