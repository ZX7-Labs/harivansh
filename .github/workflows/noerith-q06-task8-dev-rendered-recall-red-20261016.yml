name: Q06 source-owned one-turn rendered recall actual assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-rendered-recall-red-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-rendered-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 1404a4564a33969fbb37371789e1ac54acdf2d1b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-free public relay
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral read-only exact private source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Observe genuine Rust failing assertion not compiler errors
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-rendered-recall-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-toolchain.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test rendered_recall_commitment_dev source_generated_visible_recall_matches_independent_fixed_binary_vector >"$LOG" 2>&1
          RESULT=$?
          set -e
          test "$RESULT" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_DEV_RENDERED_RECALL_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test source_generated_visible_recall_matches_independent_fixed_binary_vector ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DEV_RENDERED_RECALL_ASSERTION_RED=OBSERVED
