name: Q06 Task8 durable custody five source assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-durable-five-assertion-mutants.yml]
permissions:
  contents: read
jobs:
  private-exact-durable-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 60ff5561678b1ef5a956b61e4a8f41ed0a5db223
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free privacy preflight
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private detached checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Assert all five synthetic Rust source mutants killed by named assertions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-durable-five-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/toolchain-private.log" 2>&1
          cd "$ROOT"
          if ! python3 -B tools/verify_q06_task8_durable_custody_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_DURABLE_MUTANTS=FAIL Q06_DURABLE_MUTANT_[a-z-]+=(SOURCE_MISMATCH|SURVIVED|COMPILER_NOT_KILL|WRONG_ASSERTION)$' "$LOG" || true
            echo Q06_DURABLE_FIVE_ASSERTION_MUTANTS=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_DURABLE_MUTANTS=PASS count=5' "$LOG"
          test "$(grep -Ec '^Q06_DURABLE_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 5
          grep -E '^Q06_DURABLE_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DURABLE_FIVE_ASSERTION_MUTANTS=PASS
