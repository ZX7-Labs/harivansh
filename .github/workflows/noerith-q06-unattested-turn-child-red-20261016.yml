name: Q06 private unapproved event-review child assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-unattested-turn-child-red-20261016.yml]
permissions:
  contents: read
jobs:
  pinned-assertion-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 64737d46c6476f4a75eb13c097526f38a2a4d1b1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral pinned private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require genuine source challenge child assertion RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/private-unattested-child-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test turn_challenge_crossprocess_dev fresh_child_rebinds_exact_case_event_and_registration_not_a_speaker >"$LOG" 2>&1
          CODE=$?
          set -e
          test "$CODE" -ne 0
          if grep -Eq '^error\\[E[0-9]+\\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_TURN_CHALLENGE_CHILD_ASSERTION_RED=INVALID_COMPILER_FAILURE
            exit 1
          fi
          grep -Fq 'test fresh_child_rebinds_exact_case_event_and_registration_not_a_speaker ... FAILED' "$LOG"
          grep -Fq 'Q06_PRIVATE_CHALLENGE_CHILD_MUST_RECOMPUTE_SOURCE_NOT_REPLAY_PARENT' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_TURN_CHALLENGE_CHILD_ASSERTION_RED=OBSERVED
