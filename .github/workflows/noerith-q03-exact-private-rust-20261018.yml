name: NOERITH Q03 exact source-private Rust qualification
on:
  push:
    branches: [build/noerith-q03-isolated-verification-20261018]
    paths: [.github/workflows/noerith-q03-exact-private-rust-20261018.yml]
permissions:
  contents: read
jobs:
  exact-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: 8880b4fd04355fecc1734bb4c78f4da31087ba9b
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Execute exact candidate gates with private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          mkdir -m 700 -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          if ! rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --no-self-update >"$LOGDIR/bootstrap.log" 2>&1; then
            echo "EXACT_TOOLCHAIN=BLOCKED"
            exit 1
          fi
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          uname -a >"$LOGDIR/environment.txt"
          cat /etc/os-release >>"$LOGDIR/environment.txt"
          rustc --version >>"$LOGDIR/environment.txt"
          cargo --version >>"$LOGDIR/environment.txt"
          git rev-parse HEAD >>"$LOGDIR/environment.txt"
          status=0
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "EXACT_$label=PASS"
              printf '%s PASS\n' "$label" >>"$LOGDIR/results.txt"
            else
              echo "EXACT_$label=FAIL"
              printf '%s FAIL\n' "$label" >>"$LOGDIR/results.txt"
              status=1
            fi
          }
          check source-contracts python3 tools/verify_spec.py
          check foundation-source python3 tools/verify_foundation_source.py
          check control-evidence python3 tools/verify_control_evidence.py
          check dependency-boundaries python3 tools/verify_dependency_boundaries.py
          check reference-contracts python3 tools/reference_contracts.py
          check bounded-models python3 models/bounded_reference.py
          check locked-metadata cargo metadata --locked --format-version 1
          check workspace-format cargo fmt --all -- --check
          check workspace-clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          check workspace-tests cargo test --locked --workspace --no-fail-fast
          check analyzer-format cargo fmt --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml -- --check
          check analyzer-clippy cargo clippy --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml --all-targets -- -D warnings
          check analyzer-tests cargo test --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          check analyzer-build cargo build --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          export NOERITH_Q06_ANALYZER_BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          check completed-tool-tests python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          check completed-research-tool-tests python3 -m unittest discover -s tools/research -p 'test_*.py' -v
          check wp05-mutation-qualification python3 tools/research/run_mutations.py
          check analyzer-independent python3 tools/q06_fixed_corpus_analyzer_qualification.py --analyzer "$NOERITH_Q06_ANALYZER_BIN" --manifest experiments/s05-q06-fixed-corpus-analyzer-qualification.json --source-revision "$TARGET_SHA" --output "$LOGDIR/analyzer-qualification.json"
          git diff --exit-code --quiet
          # Export formatter changes only as authenticated ciphertext.
          cargo fmt --all >"$LOGDIR/format-generation.log" 2>&1
          cargo fmt --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml >>"$LOGDIR/format-generation.log" 2>&1
          git diff --binary HEAD -- >"$LOGDIR/rustfmt.patch"
          git restore --source=HEAD --worktree .
          git diff --exit-code --quiet
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf '%s\n' "$status" >"$LOGDIR/exit-status.txt"
          test "$status" -eq 0
      - name: Encrypt diagnostics without releasing private logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          test -d "$LOGDIR"
          tar -C "$LOGDIR" -cf "$RUNNER_TEMP/consolidation-diagnostics.tar" .
          openssl cms -encrypt -aes-256-gcm -binary -in "$RUNNER_TEMP/consolidation-diagnostics.tar" -out "$RUNNER_TEMP/consolidation-diagnostics.cms" -outform DER "$GITHUB_WORKSPACE/certs/noerith-consolidation-20261025.pem" >"$RUNNER_TEMP/encryption.log" 2>&1
          test -s "$RUNNER_TEMP/consolidation-diagnostics.cms"
          echo "PRIVATE_DIAGNOSTICS_CIPHERTEXT=READY"
      - name: Export ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noerith-consolidation-encrypted-diagnostics
          path: ${{ runner.temp }}/consolidation-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
      - name: Remove ephemeral private checkout and plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/noerith-private-source" "$RUNNER_TEMP/noerith-consolidation-logs" "$RUNNER_TEMP/consolidation-diagnostics.tar"
