name: NOERITH Q03 exact source-private Rust qualification
on:
  push:
    branches: [build/noerith-q03-isolated-verification-20261018]
    paths: [.github/workflows/noerith-q03-exact-private-rust-20261018.yml]
permissions:
  contents: read
jobs:
  exact-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: aee57babb1079d136fdeb836c86802b3d6a09b16
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/checkout-noerith-private.sh
          ROOT="$RUNNER_TEMP/noerith-private-source"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 | tr -d '\n')"
          GIT_TERMINAL_PROMPT=0 git -C "$ROOT" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --unshallow --no-tags "https://github.com/oyzitjfzj/NOERITH.git" '+refs/heads/*:refs/heads/*' >"$RUNNER_TEMP/private-allrefs-access.log" 2>&1
          unset PRIVATE_READ_TOKEN auth
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          echo "PRIVATE_FULL_REF_FETCH=READY"
      - name: Execute exact candidate gates with private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          mkdir -m 700 -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          git --version >"$LOGDIR/environment.txt"
          python3 --version >>"$LOGDIR/environment.txt"
          git rev-parse HEAD >>"$LOGDIR/environment.txt"
          status=0
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "EXACT_$label=PASS"
              printf '%s PASS\n' "$label" >>"$LOGDIR/results.txt"
            else
              echo "EXACT_$label=FAIL"
              printf '%s FAIL\n' "$label" >>"$LOGDIR/results.txt"
              status=1
            fi
          }
          check completed-first-byte-model python3 tools/research/wp05_s03_egress_boundary_model.py
          check completed-streaming-model python3 tools/research/wp05_streaming_disclosure_model.py
          check native-input-equality python3 -c 'import subprocess; paths=subprocess.check_output(["git","diff","--name-only","8880b4fd04355fecc1734bb4c78f4da31087ba9b","HEAD"],text=True).splitlines(); assert set(paths)<={"tools/research/wp05_s03_egress_boundary_model.py","tools/research/wp05_streaming_disclosure_model.py",".github/workflows/ci.yml","handoff/VERIFIED_UNITS.json"},paths; print("ALL_PREVIOUSLY_QUALIFIED_EXECUTABLE_INPUTS_UNCHANGED=PASS")'
          git diff --exit-code --quiet
          git diff --binary HEAD -- >"$LOGDIR/rustfmt.patch"
          git restore --source=HEAD --worktree .
          git diff --exit-code --quiet
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf '%s\n' "$status" >"$LOGDIR/exit-status.txt"
          test "$status" -eq 0
      - name: Encrypt diagnostics without releasing private logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          test -d "$LOGDIR"
          tar -C "$LOGDIR" -cf "$RUNNER_TEMP/consolidation-diagnostics.tar" .
          openssl cms -encrypt -aes-256-gcm -binary -in "$RUNNER_TEMP/consolidation-diagnostics.tar" -out "$RUNNER_TEMP/consolidation-diagnostics.cms" -outform DER "$GITHUB_WORKSPACE/certs/noerith-consolidation-20261025.pem" >"$RUNNER_TEMP/encryption.log" 2>&1
          test -s "$RUNNER_TEMP/consolidation-diagnostics.cms"
          echo "PRIVATE_DIAGNOSTICS_CIPHERTEXT=READY"
      - name: Export ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noerith-consolidation-encrypted-diagnostics
          path: ${{ runner.temp }}/consolidation-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
      - name: Remove ephemeral private checkout and plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/noerith-private-source" "$RUNNER_TEMP/noerith-consolidation-logs" "$RUNNER_TEMP/consolidation-diagnostics.tar"
