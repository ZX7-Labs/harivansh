name: NOERITH Q03 exact source-private Rust qualification
on:
  push:
    branches: [build/noerith-q03-isolated-verification-20261018]
    paths: [.github/workflows/noerith-q03-exact-private-rust-20261018.yml]
permissions:
  contents: read
jobs:
  q03-exact-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: 5c44865f7c36035000e304efd542ef4abc921310
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Run exact private Rust tests without disclosing source logs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/noerith-q03-private-logs"
          mkdir -m 700 -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "Q03_EXACT_$label=PASS"
            else
              echo "Q03_EXACT_$label=FAIL"
              if test "$label" = rustfmt; then
                Q03_PRIVATE_LOG="$LOGDIR/$label.log" python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          log = Path(os.environ["Q03_PRIVATE_LOG"]).read_text(encoding="utf-8", errors="replace")
          hunks = re.findall(r"(?m)^Diff in ([^:\n]+\.rs):(\d+):", log)
          roles = []
          for path, line in hunks:
              if path.endswith("q03_sqlite_epoch_range.rs"):
                  role = "Q03_TEST"
              elif path.endswith("noerith-storage/src/engine.rs"):
                  role = "Q03_ENGINE"
              else:
                  role = "OTHER_RUST_FILE"
              roles.append(role + "@" + line)
          print("Q03_FMT_HUNK_COUNT=" + str(len(roles)))
          print("Q03_FMT_SAFE_COORDINATES=" + ",".join(roles[:80]))
          PY
              fi
              if test "$label" = strict-clippy; then
                Q03_PRIVATE_LOG="$LOGDIR/$label.log" python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          log = Path(os.environ["Q03_PRIVATE_LOG"]).read_text(encoding="utf-8", errors="replace")
          lints = sorted(set(re.findall(r"-D (clippy::[a-z0-9_]+)", log)))
          locations = re.findall(r"(?m)^\s*-->\s+([^:\n]+\.rs):(\d+):(\d+)", log)
          safe_sites = []
          for filename, line, _ in locations[:16]:
              role = "Q03_TEST_SOURCE" if filename.endswith("q03_sqlite_epoch_range.rs") else "OTHER_RUST_SOURCE"
              safe_sites.append(role + "@" + line)
          print("Q03_CLIPPY_ERROR_COUNT=" + str(len(re.findall(r"(?m)^error(?:\[E\d+\])?:", log))))
          print("Q03_CLIPPY_LINT_TYPES=" + ",".join(lints))
          print("Q03_CLIPPY_SAFE_SITES=" + ",".join(safe_sites))
          PY
              fi
              if grep -Eq 'error: no test target named|error: package ID specification' "$LOGDIR/$label.log"; then
                echo "Q03_DIAG_$label=TARGET_SELECTION"
              elif grep -Eq 'error\\[E[0-9]+\\]|error: could not compile|error: expected|error: unresolved import' "$LOGDIR/$label.log"; then
                echo "Q03_DIAG_$label=RUST_COMPILATION"
              elif grep -Fq 'test result: FAILED' "$LOGDIR/$label.log"; then
                echo "Q03_DIAG_$label=TEST_ASSERTION"
                if test "$label" = signed-epoch-and-custody; then
                  Q03_PRIVATE_LOG="$LOGDIR/$label.log" Q03_PRIVATE_SOURCE="$ROOT/crates/noerith-storage/tests/q03_sqlite_epoch_range.rs" python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          source = Path(os.environ["Q03_PRIVATE_SOURCE"]).read_text(encoding="utf-8")
          log = Path(os.environ["Q03_PRIVATE_LOG"]).read_text(encoding="utf-8", errors="replace")
          declared = re.findall(r"(?m)^#\[test\]\s*\nfn\s+([A-Za-z0-9_]+)\(", source)
          failures = re.findall(r"(?m)^test ([A-Za-z0-9_]+) \.\.\. FAILED$", log)
          positions = [declared.index(name) + 1 for name in failures if name in declared]
          print("Q03_DIAG_DECLARED_TESTS=" + str(len(declared)))
          print("Q03_DIAG_FAILED_ASSERTION_COUNT=" + str(len(failures)))
          print("Q03_DIAG_FAILED_TEST_ORDINALS=" + ",".join(map(str, sorted(positions))))
          print("Q03_DIAG_MAPPED_FAILURES=" + str(len(positions)))
          locations = re.findall(r"q03_sqlite_epoch_range\.rs:(\d+):(\d+)", log)
          print("Q03_DIAG_PANIC_SOURCE_LINES=" + ",".join(dict.fromkeys(line for line, _ in locations)))
          if "FOREIGN KEY constraint failed" in log:
              category = "FOREIGN_KEY_FIXTURE_REJECTED"
          elif "CHECK constraint failed" in log:
              category = "SQLITE_CHECK_FIXTURE_REJECTED"
          elif "called `Result::unwrap()` on an `Err`" in log:
              category = "UNWRAP_ERROR_OTHER"
          elif "assertion failed" in log:
              category = "RUST_ASSERTION_FALSE"
          else:
              category = "OTHER_PRIVATE_TEST_PANIC"
          print("Q03_DIAG_ASSERTION_CAUSE_CLASS=" + category)
          PY
                fi
              elif grep -Eq 'failed to download|failed to select a version|failed to get|failed to load source|checksum failed|lock file' "$LOGDIR/$label.log"; then
                echo "Q03_DIAG_$label=DEPENDENCY_OR_LOCK"
              elif grep -Eq 'panicked|SIGSEGV|signal: [0-9]+|timed out' "$LOGDIR/$label.log"; then
                echo "Q03_DIAG_$label=RUNTIME_OR_TIMEOUT"
              else
                echo "Q03_DIAG_$label=UNCLASSIFIED_REQUIRES_PRIVATE_INSPECTION"
              fi
              exit 1
            fi
          }
          check toolchain rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --no-self-update
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          check rustfmt cargo fmt --all -- --check
          check strict-clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          check signed-epoch-and-custody cargo test --locked -p noerith-storage --test q03_sqlite_epoch_range
          check storage-regression cargo test --locked -p noerith-storage
          check full-workspace cargo test --locked --workspace
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --quiet --exit-code
          echo "Q03_EXACT_PRIVATE_SOURCE_ALL_GATES=PASS"
