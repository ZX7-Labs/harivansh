name: NOERITH Q03 exact source-private Rust qualification
on:
  push:
    branches: [build/noerith-q03-isolated-verification-20261018]
    paths: [.github/workflows/noerith-q03-exact-private-rust-20261018.yml]
permissions:
  contents: read
jobs:
  exact-private-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: c97576bb610d2a6dc2541030df9f5e8d65d116fe
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only ephemeral exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Execute exact candidate gates with private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          mkdir -m 700 -p "$LOGDIR"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          if ! rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt --no-self-update >"$LOGDIR/bootstrap.log" 2>&1; then
            echo "EXACT_TOOLCHAIN=BLOCKED"
            exit 1
          fi
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          uname -a >"$LOGDIR/environment.txt"
          cat /etc/os-release >>"$LOGDIR/environment.txt"
          rustc --version >>"$LOGDIR/environment.txt"
          cargo --version >>"$LOGDIR/environment.txt"
          git rev-parse HEAD >>"$LOGDIR/environment.txt"
          status=0
          check() {
            local label="$1"
            shift
            if "$@" >"$LOGDIR/$label.log" 2>&1; then
              echo "EXACT_$label=PASS"
              printf '%s PASS\n' "$label" >>"$LOGDIR/results.txt"
            else
              echo "EXACT_$label=FAIL"
              printf '%s FAIL\n' "$label" >>"$LOGDIR/results.txt"
              status=1
            fi
          }
          check original-ref-custody python3 tools/verify_109_branch_custody.py --repo .
          check consolidation-lanes python3 tools/verify_consolidation_lanes.py --repo .
          check original-tip-archive python3 tools/verify_branch_tip_archive.py --repo .
          check all-original-tip-variants python3 tools/verify_all_tip_variants.py --repo . --check handoff/consolidation/ALL_ORIGINAL_TIP_VARIANTS_2026-10-25.json --verify-git-trees --write-current-disposition "$LOGDIR/current-disposition.json" --write-custody-report "$LOGDIR/current-original-blob-custody.json"
          check custody-negative-tests python3 -m unittest discover -s tools -p 'test_verify_*.py'
          check all-variant-negative-tests python3 -m unittest discover -s tools/tests -p test_verify_all_tip_variants.py
          check q06-helper-negative-tests python3 -m unittest discover -s tools/tests -p test_q06_verifier_integration.py
          check workspace-tests cargo test --locked --workspace --no-fail-fast
          check strict-clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          check rustfmt cargo fmt --all -- --check
          check isolated-q06 python3 tools/verify_isolated_pinned_crate_hermetic.py tools/q06-memory-context-eval
          check isolated-capabilities python3 tools/verify_isolated_pinned_crate_hermetic.py crates/noerith-capabilities
          check source-contracts python3 tools/verify_spec.py
          check dependency-boundaries python3 tools/verify_dependency_boundaries.py
          check schema-regressions python3 -m unittest discover -s tools/tests -p 'test_verify_spec*.py' -v
          check q06-field-parity-tests python3 -m unittest tools.tests.test_q06_export_field_parity -v
          check q06-field-parity-files python3 tools/research/verify_q06_export_field_parity.py
          check wp05-first-byte python3 tools/research/wp05_s03_egress_boundary_model.py
          check wp05-streaming python3 tools/research/wp05_streaming_disclosure_model.py
          check wp05-memory-gate python3 -m unittest discover -s tools/research -p test_wp05_memory_candidate_gate.py -v
          check wp05-memory-mutants python3 tools/research/run_mutations.py
          check control-evidence python3 tools/verify_control_evidence.py
          check reference-contracts python3 tools/reference_contracts.py
          check bounded-models python3 models/bounded_reference.py
          check isolated-cognition python3 tools/verify_isolated_std_crate.py crates/noerith-cognition
          check isolated-sandbox python3 tools/verify_isolated_std_crate.py crates/noerith-sandbox-oci
          check oci-validator-selftests python3 tools/verify_linux_oci_sandbox.py --self-test-only
          test -s tools/q06-fixed-corpus-analyzer/Cargo.lock
          cp tools/q06-fixed-corpus-analyzer/Cargo.lock "$LOGDIR/analyzer-Cargo.lock"
          check fixed-analyzer-format cargo fmt --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml -- --check
          check fixed-analyzer-clippy cargo clippy --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml --all-targets -- -D warnings
          check fixed-analyzer-tests cargo test --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          check fixed-analyzer-build cargo build --locked --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml
          export NOERITH_Q06_ANALYZER_BIN="$ROOT/tools/q06-fixed-corpus-analyzer/target/debug/noerith-q06-fixed-corpus-analyzer"
          check fixed-analyzer-qualifier-tests python3 -m unittest tools.tests.test_q06_fixed_corpus_analyzer_qualification -v
          check fixed-analyzer-independent python3 tools/q06_fixed_corpus_analyzer_qualification.py --analyzer "$NOERITH_Q06_ANALYZER_BIN" --manifest experiments/s05-q06-fixed-corpus-analyzer-qualification.json --source-revision "$TARGET_SHA" --output "$LOGDIR/fixed-analyzer-qualification.json"
          check mutation-selftests python3 -m unittest discover -s tools/research -p test_run_mutations.py -v
          check all-python-tool-tests python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          check all-python-research-tests python3 -m unittest discover -s tools/research -p 'test_*.py' -v
          check locked-metadata cargo metadata --locked --format-version 1
          check restore-callers grep -R -n replace_protected_database_from_backup crates
          check q03-restore-admission cargo test --locked -p noerith-storage --test q03_storage q03_restore_rejects_nonzero_unauthenticated_candidate_without_losing_current_state -- --exact
          export RUST_TEST_THREADS=32
          for iteration in $(seq 1 30); do
            check "sandbox-green-stress-$iteration" python3 tools/verify_isolated_std_crate.py crates/noerith-sandbox-oci
          done
          export RUST_TEST_THREADS=1
          check sandbox-serial python3 tools/verify_isolated_std_crate.py crates/noerith-sandbox-oci
          unset RUST_TEST_THREADS
          git diff --exit-code --quiet
          # Export formatter changes only as authenticated ciphertext.
          cargo fmt --all >"$LOGDIR/format-generation.log" 2>&1
          cargo fmt --manifest-path tools/q06-fixed-corpus-analyzer/Cargo.toml >>"$LOGDIR/format-generation.log" 2>&1
          git diff --binary HEAD -- >"$LOGDIR/rustfmt.patch"
          git restore --source=HEAD --worktree .
          git diff --exit-code --quiet
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf '%s\n' "$status" >"$LOGDIR/exit-status.txt"
          test "$status" -eq 0
      - name: Encrypt diagnostics without releasing private logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOGDIR="$RUNNER_TEMP/noerith-consolidation-logs"
          test -d "$LOGDIR"
          tar -C "$LOGDIR" -cf "$RUNNER_TEMP/consolidation-diagnostics.tar" .
          openssl cms -encrypt -aes-256-gcm -binary -in "$RUNNER_TEMP/consolidation-diagnostics.tar" -out "$RUNNER_TEMP/consolidation-diagnostics.cms" -outform DER "$GITHUB_WORKSPACE/certs/noerith-consolidation-20261025.pem" >"$RUNNER_TEMP/encryption.log" 2>&1
          test -s "$RUNNER_TEMP/consolidation-diagnostics.cms"
          echo "PRIVATE_DIAGNOSTICS_CIPHERTEXT=READY"
      - name: Export ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noerith-consolidation-encrypted-diagnostics
          path: ${{ runner.temp }}/consolidation-diagnostics.cms
          if-no-files-found: error
          retention-days: 1
      - name: Remove ephemeral private checkout and plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/noerith-private-source" "$RUNNER_TEMP/noerith-consolidation-logs" "$RUNNER_TEMP/consolidation-diagnostics.tar"
