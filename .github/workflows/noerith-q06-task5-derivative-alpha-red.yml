name: NOERITH Q06 Task5 coherent derivative alpha identity RED

on:
  push:
    branches:
      - build/noerith-q06-task5-verify-20261014
    paths:
      - .github/workflows/noerith-q06-task5-derivative-alpha-red.yml

permissions:
  contents: read

jobs:
  verify-expected-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 7a427858f7c47f20acca4d7583e22096e1e1d3d9
    steps:
      - name: Checkout public source-free relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify established privacy contract
        shell: bash
        run: bash tests/test-noerith-relay-contract.sh
      - name: Checkout exact private candidate read-only
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require genuine cross-recipe assertion RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          cd "$ROOT"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/q06-toolchain-private.log" 2>&1
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test validator \
            coherent_derivative_ref_alpha_renaming_cannot_inflate_independent_base_count \
            >"${RUNNER_TEMP}/q06-derivative-alpha-private.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -Fq 'test coherent_derivative_ref_alpha_renaming_cannot_inflate_independent_base_count ... FAILED' "${RUNNER_TEMP}/q06-derivative-alpha-private.log"
          grep -Fq 'test result: FAILED' "${RUNNER_TEMP}/q06-derivative-alpha-private.log"
          grep -Fq 'coherent derivative ID changes cannot fabricate independent lineage' "${RUNNER_TEMP}/q06-derivative-alpha-private.log"
          if grep -Eq 'error\[E[0-9]+\]|error: could not compile' "${RUNNER_TEMP}/q06-derivative-alpha-private.log"; then
            echo Q06_RELATION_ASSERTION_NOT_EXECUTED
            exit 1
          fi
          echo Q06_DERIVATIVE_ALPHA_ASSERTION_RED=OBSERVED
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
