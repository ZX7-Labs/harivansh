name: Q06 reviewed DEV one-turn view seven exact assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-dev-rendered-recall-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-source-owned-private-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: cda6aebc1f30786b1731d9ae7748e96246d78cf0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral read-only exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Seven source-owned Rust assertion kills, no private log disclosure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-rendered-recall-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task8_dev_rendered_recall_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_RENDER_MUTANT_QUALIFICATION=FAIL Q06_RENDER_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_RENDER_MUTANTS_EXACT=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_RENDER_MUTANT_QUALIFICATION=PASS count=7' "$LOG"
          test "$(grep -Ec '^Q06_RENDER_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 7
          grep -E '^Q06_RENDER_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_RENDER_MUTANTS_EXACT=PASS
