name: NOERITH Q06 unified development asset tamper proof
on:
  push:
    branches: [build/noerith-q06-unified-dev-20261015]
    paths: [.github/workflows/noerith-q06-unified-dev-tamper.yml]
permissions:
  contents: read
jobs:
  exact-source-asset-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ea408f4f4d67fa5dcfa483aed682b04158900c16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact read-only private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require actual Rust assertion kill of tampered reviewed asset
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-source-owned-asset-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update > "${RUNNER_TEMP}/q06-toolchain-private.log" 2>&1
          cd "$ROOT"
          export RUSTUP_TOOLCHAIN=1.98.1
          python3 tools/verify_q06_task6_source_owned_asset_tamper.py > "$LOG" 2>&1 || {
            echo Q06_SOURCE_OWNED_DEV_ASSET_TAMPER_NOT_QUALIFIED
            exit 1
          }
          grep -Fq 'Q06_SOURCE_OWNED_DEV_ASSET_TAMPER=KILLED_BY_ASSERTION' "$LOG"
          grep -Fq 'Q06_SOURCE_OWNED_HERMETIC_PROFILE_TAMPER=BLOCKED_BY_PIN' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_SOURCE_OWNED_ASSET_TAMPER_ASSERTION_GATE=PASS
