name: NOERITH S03 Rustfmt private shape-only diagnosis
on:
  push:
    branches: [build/noerith-kernel-callback-verify-20261016]
    paths: [.github/workflows/noerith-s03-rustfmt-shape-20261016.yml]
permissions:
  contents: read
jobs:
  shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 94c68b63c648dc44b6a4e797d2676d87573d0bf7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Private exact ephemeral read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Report private formatter hunk shapes without lines
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/tool.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          cp crates/noerith-effects/tests/s03_foundation.rs "$RUNNER_TEMP/old-source"
          cargo fmt --all >"$RUNNER_TEMP/fmt.log" 2>&1
          python3 - "$RUNNER_TEMP/old-source" crates/noerith-effects/tests/s03_foundation.rs <<'PY'
          import pathlib,difflib,sys
          old=pathlib.Path(sys.argv[1]).read_text().splitlines()
          new=pathlib.Path(sys.argv[2]).read_text().splitlines()
          diff=[(t,i,j,k,m) for (t,i,j,k,m) in difflib.SequenceMatcher(a=old,b=new,autojunk=False).get_opcodes() if t!='equal']
          print('S03_RUSTFMT_HUNKS='+str(len(diff)))
          for tag,i,j,k,m in diff[:50]:
              a=old[i:j];b=new[k:m]
              print('S03_RUSTFMT_SHAPE='+tag+':'+str(i+1)+':'+str(k+1)+':'+str(len(a))+':'+str(len(b)))
              print('S03_BEFORE_LENGTHS='+','.join(str(len(s)) for s in a))
              print('S03_AFTER_LENGTHS='+','.join(str(len(s)) for s in b))
              print('S03_AFTER_END_COMMAS='+''.join('Y' if s.strip().endswith(',') else 'N' for s in b))
          PY
          echo S03_RUSTFMT_SHAPE_COLLECTED
