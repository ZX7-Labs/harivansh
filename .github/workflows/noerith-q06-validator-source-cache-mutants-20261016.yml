name: Q06 independent validator immutable catalog assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-validator-source-cache-mutants-20261016.yml]
permissions:
  contents: read
jobs:
  exact-private-source-assertion-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 85baf3cfe9212a63391dd1f517d9c384e72a89bf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public relay contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral pinned private read-only checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Two real named Rust assertion mutation kills
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-validator-cache-mutants-private.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-toolchain-install.log" 2>&1
          cd "$ROOT"
          if ! python3 tools/verify_q06_task5_validator_registry_cache_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_VALIDATOR_CACHE_MUTANT_QUALIFICATION=FAIL Q06_VALIDATOR_CACHE_MUTANT_[a-z0-9-]+=(SOURCE_MISMATCH|SURVIVED|WRONG_ASSERTION|COMPILER_FAILURE_NOT_KILL)$' "$LOG" || true
            echo Q06_VALIDATOR_CACHE_TWO_MUTANTS=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_VALIDATOR_CACHE_MUTANT_QUALIFICATION=PASS count=2' "$LOG"
          test "$(grep -Ec '^Q06_VALIDATOR_CACHE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 2
          grep -E '^Q06_VALIDATOR_CACHE_MUTANT_[a-z0-9-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_VALIDATOR_CACHE_TWO_MUTANTS=PASS
