name: Q06 dev candidate-visible JSON thirteen assertion mutants
on:
  push:
    branches: [build/noerith-q06-validated-recall-20261015]
    paths: [.github/workflows/noerith-q06-dev-candidate-dto-mutants.yml]
permissions:
  contents: read
jobs:
  assertion-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 6ff1758a6f3c385c4dd690acb1cd1af5d184e228
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free privacy contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact read-only private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require actual Rust assertion kills, not compiler failures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-recall-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/toolchain.log" 2>&1
          cd "$ROOT"
          python3 tools/verify_q06_task6_dev_recall_surface_mutants.py >"$LOG" 2>&1 || {
            echo Q06_RECALL_MUTATION_GATE=FAIL
            exit 1
          }
          grep -Fxq "Q06_RECALL_MUTANT_QUALIFICATION=PASS count=13" "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 13
          grep '^Q06_RECALL_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_RECALL_THIRTEEN_ASSERTION_MUTANTS=PASS
