name: NOERITH Q06 private canonical Rustfmt patch transfer

on:
  push:
    branches:
      - build/noerith-q06-source-order-red-20261015
    paths:
      - .github/workflows/noerith-q06-task5-fmt-patch.yml

permissions:
  contents: read

jobs:
  encrypted-format-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 26f23571113cb943248aa3727f0e6b8846201a03
    steps:
      - name: Checkout source-free public relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy preflight
        shell: bash
        run: bash tests/test-noerith-relay-contract.sh
      - name: Read-only pinned private checkout
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Format only ephemeral private checkout then encrypt the exact patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          PATCH="${RUNNER_TEMP}/q06-private-rustfmt.patch"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"${RUNNER_TEMP}/rustfmt-install-private.log" 2>&1
          cd "$ROOT"
          cargo +1.98.1 fmt --manifest-path tools/q06-memory-context-eval/Cargo.toml >"${RUNNER_TEMP}/q06-rustfmt-private.log" 2>&1
          git diff -- tools/q06-memory-context-eval/src/validator.rs tools/q06-memory-context-eval/tests/validator_source_order.rs > "$PATCH"
          test -s "$PATCH"
          OTHER="$(git diff --name-only -- . ':!tools/q06-memory-context-eval/src/validator.rs' ':!tools/q06-memory-context-eval/tests/validator_source_order.rs')"
          test -z "$OTHER"
          gzip -9 -c "$PATCH" | openssl cms -encrypt -binary -aes256 -outform DER \
            -recip "${GITHUB_WORKSPACE}/certs/q06-task5-format-receipt-20261015.pem" \
            -out "${RUNNER_TEMP}/q06-encrypted-format-patch.cms"
          rm -f "$PATCH"
          echo Q06_FMT_CIPHERTEXT_BEGIN
          base64 -w 0 "${RUNNER_TEMP}/q06-encrypted-format-patch.cms"
          echo
          echo Q06_FMT_CIPHERTEXT_END
          echo Q06_PRIVATE_FMT_PATCH_CIPHERTEXT_ONLY=PASS
