name: NOERITH kernel callback assertion RED
on:
  push:
    branches: [build/noerith-kernel-callback-verify-20261016]
    paths: [.github/workflows/noerith-kernel-callback-assertion-red.yml]
permissions:
  contents: read
jobs:
  exact-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: b5ac736306dbd558225a588ba1b93beebc069192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free relay
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Rust 1.98.1 assertion RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/noerith-private-source"
          LOG="$RUNNER_TEMP/kernel-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"$RUNNER_TEMP/rustup.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          if cargo test --locked -p noerith-kernel --lib premature_provider_callback_does_not_poison_later_valid_receipt >"$LOG" 2>&1; then
            echo KERNEL_CALLBACK_RED=UNEXPECTED_PASS
            exit 1
          fi
          grep -Eq 'premature_provider_callback_does_not_poison_later_valid_receipt.*FAILED' "$LOG"
          grep -Fq 'assertion' "$LOG"
          echo KERNEL_CALLBACK_RED=OBSERVED
