name: Q06 exact private claim and observer assertion mutants
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-partial-claim-durable-mutants.yml]
permissions:
  contents: read
jobs:
  exact-private-durable-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 7c7e4fe5929ed4039e90568f0a8483fb5d80fd9c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free boundary
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Six real Rust assertion kills, no compile-failure credit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-durable-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/private-rust-install.log" 2>&1
          cd "$ROOT"
          if ! python3 -B tools/verify_q06_task8_dev_durable_custody_mutants.py >"$LOG" 2>&1; then
            grep -E '^Q06_DURABLE_MUTANT_QUALIFICATION=FAIL (Q06_DURABLE_MUTANT_[a-z-]+=(SOURCE_MISMATCH|SURVIVED|COMPILER_FAILURE_NOT_KILL|WRONG_ASSERTION)|[A-Za-z]+Error)$' "$LOG" || true
            echo Q06_DURABLE_MUTANT_GATE=FAIL
            exit 1
          fi
          grep -Fxq 'Q06_DURABLE_MUTANT_QUALIFICATION=PASS count=6' "$LOG"
          test "$(grep -Ec '^Q06_DURABLE_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG")" -eq 6
          grep -E '^Q06_DURABLE_MUTANT_[a-z-]+=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_DURABLE_SIX_ASSERTION_MUTANTS=PASS
          OBSERVER_LOG="${RUNNER_TEMP}/q06-private-observer-mutants.log"
          if ! python3 -B tools/verify_q06_task8_dev_local_observer_mutants.py >"$OBSERVER_LOG" 2>&1; then
            echo Q06_OBSERVER_MUTANT_GATE=FAIL
            exit 1
          fi
          grep -Fxq "Q06_OBSERVER_MUTANT_QUALIFICATION=PASS count=6" "$OBSERVER_LOG"
          test "$(grep -c "=KILLED_BY_ASSERTION" "$OBSERVER_LOG")" -eq 6
          grep "=KILLED_BY_ASSERTION" "$OBSERVER_LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_OBSERVER_SIX_ASSERTION_MUTANTS=PASS
