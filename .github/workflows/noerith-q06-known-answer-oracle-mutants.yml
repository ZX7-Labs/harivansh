name: Q06 independent action oracle three assertion mutants
on:
  push:
    branches: [build/noerith-q06-known-answer-actions-20261015]
    paths: [.github/workflows/noerith-q06-known-answer-oracle-mutants.yml]
permissions:
  contents: read
jobs:
  source-free-pinned-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 1eb6e6c15605e017a0893f734be19b743c380ff0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/test-noerith-relay-contract.sh
      - name: Exact private source checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Prove three real Rust oracle mutations fail known-answer assertions
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-private-reference-mutants.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/rust-install-private.log" 2>&1
          cd "$ROOT"
          export RUSTUP_TOOLCHAIN=1.98.1
          python3 tools/verify_q06_task5_known_answer_oracle_mutants.py >"$LOG" 2>&1 || {
            echo Q06_KNOWN_ANSWER_MUTANTS_NOT_QUALIFIED
            exit 1
          }
          grep -Fq 'Q06_KNOWN_ANSWER_ORACLE_MUTANTS=PASS count=3' "$LOG"
          test "$(grep -c '=KILLED_BY_ASSERTION' "$LOG")" -eq 3
          grep '^Q06_KNOWN_ANSWER_MUTANT_[a-z-]*=KILLED_BY_ASSERTION$' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_KNOWN_ANSWER_THREE_ASSERTION_MUTANTS=PASS
