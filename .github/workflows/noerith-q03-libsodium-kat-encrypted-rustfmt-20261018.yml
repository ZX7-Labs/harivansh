name: NOERITH Q03 independent libsodium KAT exact encrypted Rustfmt
on:
  push:
    branches: [build/noerith-q03-snapshot-signed-red-20261018]
    paths: [.github/workflows/noerith-q03-libsodium-kat-encrypted-rustfmt-20261018.yml]
permissions:
  contents: read
jobs:
  exact-private-source-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 40007c561022e640ef93c0ef5d64fb1314d4a55d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free public contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Ephemeral exact private read-only source
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Pin formatter, CMS-encrypt all product-private diff bytes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$RUNNER_TEMP/noerith-private-source"
          PATCH="$RUNNER_TEMP/q03-private-kat-fmt.patch"
          SEALED="$RUNNER_TEMP/q03-private-kat-fmt.cms"
          CERT="$GITHUB_WORKSPACE/certs/q03-local-only-encrypted-diagnostics-20261018.pem"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          openssl x509 -in "$CERT" -noout >"$RUNNER_TEMP/check-cert.log" 2>&1
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update >"$RUNNER_TEMP/rustup.log" 2>&1
          export RUSTUP_TOOLCHAIN=1.98.1
          cd "$ROOT"
          M="research/q03-legacy-v1-auth-probe/Cargo.toml"
          cargo fmt --manifest-path "$M" >"$RUNNER_TEMP/private-fmt.log" 2>&1
          cargo fmt --manifest-path "$M" -- --check >"$RUNNER_TEMP/private-check.log" 2>&1
          git diff --binary -- research/q03-legacy-v1-auth-probe/tests/q03_official_libsodium_original_v1_known_answer.rs >"$PATCH"
          count="$(git diff --name-only | wc -l)"
          echo "Q03_LIBSODIUM_FMT_FILE_COUNT=$count"
          test "$count" -eq 1
          test -s "$PATCH"
          echo "Q03_LIBSODIUM_FMT_PATCH_SHA256=$(sha256sum "$PATCH" | cut -d' ' -f1)"
          echo "Q03_LIBSODIUM_FMT_PATCH_BYTES=$(wc -c <"$PATCH")"
          openssl cms -encrypt -binary -aes256 -outform DER -in "$PATCH" -out "$SEALED" "$CERT" >"$RUNNER_TEMP/cms.log" 2>&1
          test -s "$SEALED"
          rm -f "$PATCH" "$RUNNER_TEMP/private-fmt.log" "$RUNNER_TEMP/private-check.log"
          echo Q03_LIBSODIUM_FMT_CIPHERTEXT_ONLY=PASS
      - name: Upload encrypted patch only for 24 hours
        uses: actions/upload-artifact@v4
        with:
          name: q03-libsodium-kat-exact-rustfmt-cms
          path: ${{ runner.temp }}/q03-private-kat-fmt.cms
          retention-days: 1
          if-no-files-found: error
