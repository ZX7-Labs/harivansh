name: Q06 Task8 anchored descriptor development seed assertion RED
on:
  push:
    branches: [build/noerith-q06-task8-dev-seedfile-20261015]
    paths: [.github/workflows/noerith-q06-task8-seed-dirfd-assertion-red.yml]
permissions:
  contents: read
jobs:
  red-exact-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 62f0c16aff884b9b907241576582ad42c73ad07c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-free contract
        run: bash tests/test-noerith-relay-contract.sh
      - name: Exact detached private checkout
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        run: bash scripts/checkout-noerith-private.sh
      - name: Require focused real Rust assertion RED
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/noerith-private-source"
          LOG="${RUNNER_TEMP}/q06-anchored-dirfd-synthetic-red.log"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$TARGET_SHA"
          rustup toolchain install 1.98.1 --profile minimal --no-self-update >"${RUNNER_TEMP}/q06-rust-private.log" 2>&1
          cd "$ROOT"
          set +e
          cargo +1.98.1 test --manifest-path tools/q06-memory-context-eval/Cargo.toml --locked --test seed_root_dir_dev authentic_private_anchor_reads_32_byte_seed_without_path_name_in_result >"$LOG" 2>&1
          CODE=$?
          set -e
          test "$CODE" -ne 0
          if grep -Eq '^error\[E[0-9]+\]|^error: could not compile|^error: failed to' "$LOG"; then
            echo Q06_ROOTED_SEED_ASSERTION_RED=NOT_QUALIFIED_COMPILATION
            exit 1
          fi
          grep -Fq 'test authentic_private_anchor_reads_32_byte_seed_without_path_name_in_result ... FAILED' "$LOG"
          grep -Fq 'test result: FAILED' "$LOG"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code --quiet
          echo Q06_ROOTED_SEED_ASSERTION_RED=OBSERVED
